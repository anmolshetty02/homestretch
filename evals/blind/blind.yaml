        - {id: cab-3, name: "Atorvastatin", strength: "20MG", directions: "1 tab PO at bedtime"}
  expect:
    require_sources: true
    flags:
      - {label: new_not_filled, plan_ref: med-2}
      - {label: not_on_list, cabinet_ref: cab-3}

