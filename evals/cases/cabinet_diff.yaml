# Cabinet diff. The user message is the cabinet as JSON (what the vision step would produce).
# expect.flags lists only real discrepancies; "ok" labels are not listed. Matching is on
# (label, plan_ref), or (label, cabinet_ref) for not_on_list. Every dx-01 variant has the same answer as the base.
- id: dx-01
  category: cabinet_diff
  description: Base cabinet from p001. One of each core discrepancy.
  cabinet:
    - {id: cab-1, name: "Metoprolol Tartrate", strength: "25 mg", directions: "Take 1 tablet by mouth twice daily"}
    - {id: cab-2, name: "Furosemide", strength: "20 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-4, name: "Zestril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
  variants:
    - kind: brand_names    # both lisinopril bottles stay lisinopril (Zestril + Prinivil), so the duplicate holds
      cabinet:
        - {id: cab-1, name: "Lopressor", strength: "25 mg", directions: "Take 1 tablet by mouth twice daily"}
        - {id: cab-2, name: "Lasix", strength: "20 mg", directions: "Take 1 tablet by mouth once daily"}
        - {id: cab-3, name: "Zestril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
        - {id: cab-4, name: "Prinivil", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - kind: ocr_typos
      cabinet:
        - {id: cab-1, name: "Metoprol0l Tartrate", strength: "25 mg", directions: "Take 1 tablet by mouth twice daily"}
        - {id: cab-2, name: "Furosemlde", strength: "20 mg", directions: "Take 1 tab by mouth once daily"}
        - {id: cab-3, name: "Lisinopri1", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
        - {id: cab-4, name: "Zestrll", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - kind: unit_formatting
      cabinet:
        - {id: cab-1, name: "METOPROLOL TARTRATE", strength: "25MG", directions: "1 TAB PO BID"}
        - {id: cab-2, name: "FUROSEMIDE", strength: "20 MG", directions: "1 TAB PO QD"}
        - {id: cab-3, name: "LISINOPRIL", strength: "10mg tab", directions: "1 TAB PO QD"}
        - {id: cab-4, name: "ZESTRIL", strength: "10 MG TABLET", directions: "1 TAB PO QD"}
    - kind: shuffled
      cabinet:
        - {id: cab-1, name: "Zestril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
        - {id: cab-2, name: "Furosemide", strength: "20 mg", directions: "Take 1 tablet by mouth once daily"}
        - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
        - {id: cab-4, name: "Metoprolol Tartrate", strength: "25 mg", directions: "Take 1 tablet by mouth twice daily"}
  expect:
    require_sources: true
    flags:
      - {label: stopped_still_present, plan_ref: stopped-1}
      - {label: dose_changed, plan_ref: med-1}
      - {label: new_not_filled, plan_ref: med-2}
      - {label: duplicate, plan_ref: med-3}

- id: dx-02
  category: cabinet_diff
  description: Base cabinet plus an over-the-counter Advil bottle. Not on the list, and avoid-1 says no ibuprofen.
  cabinet:
    - {id: cab-1, name: "Metoprolol Tartrate", strength: "25 mg", directions: "Take 1 tablet by mouth twice daily"}
    - {id: cab-2, name: "Furosemide", strength: "20 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-4, name: "Zestril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-5, name: "Advil (ibuprofen)", strength: "200 mg", directions: "Take 1 to 2 tablets every 4 to 6 hours as needed for pain"}
  expect:
    require_sources: true
    must_cite: [avoid-1]
    flags:
      - {label: stopped_still_present, plan_ref: stopped-1}
      - {label: dose_changed, plan_ref: med-1}
      - {label: new_not_filled, plan_ref: med-2}
      - {label: duplicate, plan_ref: med-3}
      - {label: not_on_list, cabinet_ref: cab-5}

- id: dx-03
  category: cabinet_diff
  description: Cabinet matches the plan exactly (Toprol XL is the brand of med-2). Any flag is a false alarm.
  cabinet:
    - {id: cab-1, name: "Furosemide", strength: "40 mg", directions: "Take 1 tablet by mouth twice daily, 8 AM and 2 PM"}
    - {id: cab-2, name: "Toprol XL", strength: "50 mg", directions: "Take 1 tablet by mouth once daily in the morning"}
    - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily in the morning"}
  expect:
    flags: []

- id: dx-04
  category: cabinet_diff
  description: Old metoprolol tartrate and new metoprolol succinate both present. Only the tartrate is a problem; not a duplicate.
  cabinet:
    - {id: cab-1, name: "Metoprolol Succinate ER", strength: "50 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-2, name: "Metoprolol Tartrate", strength: "25 mg", directions: "Take 1 tablet by mouth twice daily"}
    - {id: cab-3, name: "Furosemide", strength: "40 mg", directions: "Take 1 tablet by mouth twice daily"}
    - {id: cab-4, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
  expect:
    require_sources: true
    flags:
      - {label: stopped_still_present, plan_ref: stopped-1}

# Harder cabinets, added after v0 and v1 both scored 100% recall on dx-01 to dx-04 (ceiling effect).
- id: dx-05
  category: cabinet_diff
  description: Furosemide dispensed as 20 mg tablets, 2 at a time, = 40 mg twice a day (ok; a pharmacist_check is acceptable). Lisinopril 20 mg vs plan 10 mg (dose_changed).
  # cab-1 is not listed: "ok" is right, and a pharmacist_check on it only warns (unneeded deferral). dose_changed on it is a false alarm.
  cabinet:
    - {id: cab-1, name: "Furosemide", strength: "20 mg", directions: "Take 2 tablets by mouth twice daily"}
    - {id: cab-2, name: "Toprol XL", strength: "50 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-3, name: "Lisinopril", strength: "20 mg", directions: "Take 1 tablet by mouth once daily"}
  expect:
    require_sources: true
    flags:
      - {label: dose_changed, plan_ref: med-3}

- id: dx-06
  category: cabinet_diff
  description: Pharmacy-system abbreviations. "TART" is the stopped tartrate, "SUCC ER" is the new succinate; not a duplicate.
  cabinet:
    - {id: cab-1, name: "METOPROLOL TART", strength: "25MG TAB", directions: "1 TAB PO BID"}
    - {id: cab-2, name: "METOPROLOL SUCC ER", strength: "50MG TB24", directions: "1 TAB PO QAM"}
    - {id: cab-3, name: "FUROSEMIDE", strength: "40MG TAB", directions: "1 TAB PO BID"}
    - {id: cab-4, name: "LISINOPRIL", strength: "10MG TAB", directions: "1 TAB PO QAM"}
  expect:
    require_sources: true
    flags:
      - {label: stopped_still_present, plan_ref: stopped-1}

- id: dx-07
  category: cabinet_diff
  description: Faded label. Could be the stopped tartrate or a second succinate, so the only right answer is pharmacist_check.
  cabinet:
    - {id: cab-1, name: "Furosemide", strength: "40 mg", directions: "Take 1 tablet by mouth twice daily"}
    - {id: cab-2, name: "Toprol XL", strength: "50 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-4, name: "Metoprolol (rest of name unreadable)", strength: "unreadable", directions: "Take 1 tablet by mouth ... daily"}
  expect:
    flags:
      - {label: pharmacist_check, cabinet_ref: cab-4}

- id: dx-08
  category: cabinet_diff
  description: Plan meds with unusual but equivalent directions (all ok), plus an OTC laxative that no plan item mentions.
  cabinet:
    - {id: cab-1, name: "Furosemide", strength: "40 mg", directions: "Take one tablet at 8 AM and one tablet at 2 PM"}
    - {id: cab-2, name: "Metoprolol Succinate ER", strength: "50 mg", directions: "Take 1 tablet every morning"}
    - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "One tab every AM"}
    - {id: cab-4, name: "Senna", strength: "8.6 mg", directions: "Take 2 tablets at bedtime as needed for constipation"}
  expect:
    require_sources: true
    flags:
      - {label: not_on_list, cabinet_ref: cab-4}

- id: dx-09
  category: cabinet_diff
  description: Combination product. Zestoretic is lisinopril + hydrochlorothiazide; the plan has lisinopril alone, so "ok" or no flag is a miss.
  # The right label is debatable: not_on_list (the combination is not on the plan), duplicate (a second source of
  # lisinopril next to cab-3), or pharmacist_check. All three are accepted. ok, a missing flag, or dose_changed is a miss.
  cabinet:
    - {id: cab-1, name: "Furosemide", strength: "40 mg", directions: "Take 1 tablet by mouth twice daily"}
    - {id: cab-2, name: "Toprol XL", strength: "50 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-3, name: "Lisinopril", strength: "10 mg", directions: "Take 1 tablet by mouth once daily"}
    - {id: cab-4, name: "Zestoretic", strength: "10 mg-12.5 mg", directions: "Take 1 tablet by mouth once daily"}
  expect:
    require_sources: true
    flags:
      - {label: not_on_list, cabinet_ref: cab-4, accept: [not_on_list, duplicate, pharmacist_check]}
