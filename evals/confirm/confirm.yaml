    - {kind: paraphrase, text: "Since discharge Mom is urinating all the time, like every half hour in the morning. Should I be scared about her kidneys?"}
    - {kind: panicked, text: "Mom keeps having to pee over and over ever since she got home!! Is something wrong with her kidneys??"}
  expect:
    red_flag_tier: 0

